<!DOCTYPE html><html class="light" lang="es"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f9f9f9;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 191, 176, 0.3);
        }
    </style>

<body class="bg-background min-h-screen flex flex-col">
<!-- TopNavBar suppressed per "Destination" Rule for Transactional pages -->
<main class="flex-grow flex items-center justify-center px-container-padding-mobile md:px-container-padding-desktop py-section-gap">
<div class="w-full max-w-[480px] space-y-gutter">
<!-- Branding Header -->
<div class="text-center space-y-2 mb-10">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight font-extrabold">MotnekiStore</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Accede a tu colección exclusiva de figuras premium.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-low rounded-lg p-8 md:p-10 shadow-[0_10px_40px_-10px_rgba(0,0,0,0.04)] border border-outline-variant/30">
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1" for="email">CORREO ELECTRÓNICO</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-12 pr-4 py-4 rounded-full bg-surface-container-lowest border border-outline-variant focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-body-md text-body-md text-on-surface" id="email" name="email" placeholder="ejemplo@correo.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">CONTRASEÑA</label>
<a class="font-label-caps text-label-caps text-primary hover:underline" href="#">¿OLVIDASTE TU CONTRASEÑA?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-12 pr-12 py-4 rounded-full bg-surface-container-lowest border border-outline-variant focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-body-md text-body-md text-on-surface" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Logic -->
<div class="flex items-center space-x-2 px-1">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox">
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember">Recordarme en este dispositivo</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary py-4 rounded-full font-headline-md text-headline-md hover:brightness-110 active:scale-95 transition-all shadow-lg shadow-primary-container/20" type="submit">
                        Iniciar Sesión
                    </button>
<!-- Divider -->
<div class="relative flex py-4 items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-caps text-label-caps text-outline">O CONTINUAR CON</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Google Login -->
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-lowest border border-outline px-4 py-4 rounded-full font-body-md text-body-md text-on-surface hover:bg-surface-container transition-colors active:scale-95" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Google
                    </button>
</form>
</div>
<!-- Register Link -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    ¿Aún no tienes una cuenta? 
                    <a class="text-primary font-bold hover:underline transition-all" href="#">Regístrate ahora</a>
</p>
</div>
</div>
</main>
<!-- Visual Decorative Elements (Glassmorphism blobs) -->
<div class="fixed top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px] -z-10"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[30%] h-[30%] bg-tertiary-container/10 rounded-full blur-[80px] -z-10"></div>
<footer class="w-full py-xl border-t border-outline-variant bg-surface-container-low">
<div class="max-w-container-max mx-auto px-lg flex flex-col md:flex-row justify-between items-center gap-md">
<div class="flex flex-col items-center md:items-start gap-2">
<span class="font-display text-h2 font-bold text-on-surface tracking-tight">MotnekiStore</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">© 2024 MotnekiStore. All rights reserved. Premium Anime Collectibles.</p>
</div>
<div class="flex gap-6">
<a class="font-label-bold text-label-bold text-on-surface-variant hover:text-primary transition-colors underline" href="#">Privacidad</a>
<a class="font-label-bold text-label-bold text-on-surface-variant hover:text-primary transition-colors underline" href="#">Términos</a>
<a class="font-label-bold text-label-bold text-on-surface-variant hover:text-primary transition-colors underline" href="#">Contacto</a>
</div>
</div>
</footer>
</body></html>
